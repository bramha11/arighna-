<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Arighna Pharma · Admin</title>
  <link rel="icon" type="image/png" href="../assets/Photos/logo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] }, colors: { navy: "#002A5C", teal: "#0493BB" } } } };
  </script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="bg-[#F4F7FA] text-navy font-sans antialiased">

  <!-- LOGIN -->
  <div id="loginView" class="hidden min-h-screen flex items-center justify-center p-6">
    <form id="loginForm" class="w-full max-w-[420px] bg-white rounded-[28px] border border-slate-100 shadow-xl p-8 sm:p-10">
      <img src="../assets/Photos/logo-horizontal.png" alt="Arighna Pharma" class="h-11 w-auto mb-8" />
      <h1 class="text-2xl font-semibold mb-1">Admin login</h1>
      <p class="text-sm text-slate-500 mb-8">Manage products, blogs, careers and messages.</p>
      <label class="field-label" for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="username" required class="field mb-5" />
      <label class="field-label" for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required class="field mb-6" />
      <p id="loginError" class="hidden text-sm text-red-600 mb-4"></p>
      <button type="submit" class="btn-primary w-full justify-center">Log in</button>
    </form>
  </div>

  <!-- APP -->
  <div id="appView" class="hidden min-h-screen lg:flex">
    <aside class="lg:w-[260px] lg:shrink-0 bg-navy text-white lg:min-h-screen lg:sticky lg:top-0 flex lg:flex-col">
      <div class="px-6 py-5 lg:py-7 flex items-center justify-between w-full lg:block">
        <img src="../assets/Photos/logo-horizontal-white.png" alt="Arighna Pharma" class="h-9 w-auto" />
        <button id="menuToggle" class="lg:hidden p-2 rounded-xl bg-white/10" aria-label="Menu"><i data-lucide="menu" class="w-5 h-5"></i></button>
      </div>
      <nav id="sideNav" class="hidden lg:flex flex-col gap-1 px-3 pb-6 absolute lg:static top-[76px] inset-x-0 z-40 bg-navy lg:bg-transparent">
        <a href="#dashboard" class="nav-item"><i data-lucide="layout-dashboard"></i>Dashboard</a>
        <a href="#products" class="nav-item"><i data-lucide="pill"></i>Products</a>
        <a href="#categories" class="nav-item"><i data-lucide="tags"></i>Categories</a>
        <a href="#blogs" class="nav-item"><i data-lucide="file-text"></i>Blogs</a>
        <a href="#jobs" class="nav-item"><i data-lucide="briefcase"></i>Job openings</a>
        <a href="#applications" class="nav-item"><i data-lucide="user-check"></i>Applications <span class="nav-badge" data-badge="applications"></span></a>
        <a href="#messages" class="nav-item"><i data-lucide="mail"></i>Messages <span class="nav-badge" data-badge="messages"></span></a>
        <div class="mt-auto pt-6 px-3 border-t border-white/10 lg:mt-8">
          <p id="adminEmail" class="text-xs text-white/50 mb-3 truncate"></p>
          <a href="../" target="_blank" class="nav-item"><i data-lucide="external-link"></i>View website</a>
          <button id="logoutBtn" class="nav-item w-full"><i data-lucide="log-out"></i>Log out</button>
        </div>
      </nav>
    </aside>
    <main class="flex-1 min-w-0 p-5 sm:p-8 lg:p-10">
      <div id="view"></div>
    </main>
  </div>

  <!-- MODAL -->
  <div id="modal" class="hidden fixed inset-0 z-50 bg-navy/40 backdrop-blur-sm flex items-start sm:items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-[24px] shadow-2xl w-full max-w-[560px] my-8">
      <div class="flex items-center justify-between px-6 pt-6">
        <h3 id="modalTitle" class="text-lg font-semibold"></h3>
        <button data-close class="p-2 rounded-full hover:bg-slate-100" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="modalBody" class="p-6"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="hidden fixed bottom-6 right-6 z-[60] px-5 py-3 rounded-2xl text-sm font-medium shadow-xl"></div>

  <script src="admin.js"></script>
</body>
</html>
