<!-- WebGL Background Force & Watermark Removal Script -->
<script>
  (function fixSplineCanvas() {
    const viewer = document.getElementById('cns-spline');
    if (!viewer) return;

    function applyCanvasOverrides() {
      if (!viewer.shadowRoot) return;

      // 1. Hide Logo Watermark
      const logo = viewer.shadowRoot.querySelector('#logo');
      if (logo) {
        logo.style.setProperty('display', 'none', 'important');
        logo.style.setProperty('opacity', '0', 'important');
      }

      // 2. Target Canvas & Override WebGL Context Clear Color
      const canvas = viewer.shadowRoot.querySelector('canvas');
      if (canvas) {
        canvas.style.setProperty('background', '#ffffff', 'important');
        canvas.style.setProperty('background-color', '#ffffff', 'important');

        // Access internal WebGL / WebGL2 context
        const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
        if (gl) {
          // Force clear color to white (R:1, G:1, B:1, A:1)
          gl.clearColor(1.0, 1.0, 1.0, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);
        }
      }
    }

    // Run interval continuously during initial load
    const timer = setInterval(applyCanvasOverrides, 30);

    viewer.addEventListener('load', () => {
      applyCanvasOverrides();
      // Keep checking briefly after load to ensure WebGL frame buffer doesn't overwrite it
      setTimeout(() => clearInterval(timer), 1000);
    });
  })();
</script>
